<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <!-- Deep Scientific Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041122" />
      <stop offset="50%" stop-color="#071f38" />
      <stop offset="100%" stop-color="#062c43" />
    </linearGradient>

    <!-- Bioluminescent Cyan/Teal Glows -->
    <radialGradient id="cyanGlow" cx="50%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#0ea5e9" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#041122" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="72%" cy="32%" r="35%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="helixGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="helixGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2942" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#08182b" stop-opacity="0.92" />
    </linearGradient>

    <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.22" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="800" height="560" rx="24" fill="url(#bgGrad)" />
  <rect width="800" height="560" rx="24" fill="url(#cyanGlow)" />
  <rect width="800" height="560" rx="24" fill="url(#emeraldGlow)" />

  <!-- Subtle Technical Grid -->
  <g stroke="#1e3a5f" stroke-width="0.7" opacity="0.35">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="480" x2="800" y2="480" />
    <line x1="100" y1="0" x2="100" y2="560" />
    <line x1="200" y1="0" x2="200" y2="560" />
    <line x1="300" y1="0" x2="300" y2="560" />
    <line x1="400" y1="0" x2="400" y2="560" />
    <line x1="500" y1="0" x2="500" y2="560" />
    <line x1="600" y1="0" x2="600" y2="560" />
    <line x1="700" y1="0" x2="700" y2="560" />
  </g>

  <!-- Top Telemetry Header Bar -->
  <rect x="28" y="24" width="744" height="42" rx="10" fill="#081a2e" stroke="#1e4976" stroke-width="1" />
  <circle cx="50" cy="45" r="5" fill="#10b981" />
  <circle cx="68" cy="45" r="5" fill="#06b6d4" />
  <circle cx="86" cy="45" r="5" fill="#3b82f6" />
  <text x="108" y="49" fill="#7dd3fc" font-family="monospace" font-size="12" font-weight="bold">
    M&amp;M BioATLAS // R&amp;D HIGH-THROUGHPUT BIO-COMPUTING ENGINE v4.2
  </text>
  <rect x="625" y="33" width="132" height="24" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
  <text x="640" y="49" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="bold">
    GPU CLUSTER: ON
  </text>

  <!-- Left Panel: Automated Nextflow & Multi-Omics Neural Graph -->
  <rect x="28" y="84" width="235" height="270" rx="14" fill="url(#cardGrad)" stroke="#1e4976" stroke-width="1.2" />
  <text x="46" y="112" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">
    AI CONFORMATIONAL FILTER
  </text>
  <text x="46" y="130" fill="#94a3b8" font-family="sans-serif" font-size="10">
    Deep Graph Neural Network Screening
  </text>

  <!-- Neural Network Layers inside Left Panel -->
  <g stroke="#0ea5e9" stroke-width="1.2" opacity="0.55">
    <line x1="68" y1="165" x2="145" y2="155" />
    <line x1="68" y1="165" x2="145" y2="195" />
    <line x1="68" y1="165" x2="145" y2="235" />
    <line x1="68" y1="205" x2="145" y2="155" />
    <line x1="68" y1="205" x2="145" y2="195" />
    <line x1="68" y1="205" x2="145" y2="235" />
    <line x1="68" y1="245" x2="145" y2="195" />
    <line x1="68" y1="245" x2="145" y2="235" />
    <line x1="68" y1="245" x2="145" y2="275" />

    <line x1="145" y1="155" x2="220" y2="180" stroke="#14b8a6" />
    <line x1="145" y1="195" x2="220" y2="180" stroke="#14b8a6" />
    <line x1="145" y1="195" x2="220" y2="230" stroke="#14b8a6" />
    <line x1="145" y1="235" x2="220" y2="180" stroke="#14b8a6" />
    <line x1="145" y1="235" x2="220" y2="230" stroke="#14b8a6" />
    <line x1="145" y1="275" x2="220" y2="230" stroke="#14b8a6" />
  </g>

  <!-- Neural Nodes -->
  <g fill="#38bdf8">
    <circle cx="68" cy="165" r="7" />
    <circle cx="68" cy="205" r="7" />
    <circle cx="68" cy="245" r="7" />
  </g>
  <g fill="#22d3ee">
    <circle cx="145" cy="155" r="8" />
    <circle cx="145" cy="195" r="8" />
    <circle cx="145" cy="235" r="8" />
    <circle cx="145" cy="275" r="8" />
  </g>
  <g fill="#10b981">
    <circle cx="220" cy="180" r="9" />
    <circle cx="220" cy="230" r="9" />
  </g>

  <!-- Metrics inside Left Panel -->
  <rect x="44" y="302" width="202" height="36" rx="8" fill="#061527" stroke="#0e7490" stroke-width="0.9" />
  <text x="56" y="324" fill="#67e8f9" font-family="monospace" font-size="11" font-weight="bold">
    ΔG Binding: -11.4 kcal/mol
  </text>

  <!-- Centerpiece: 3D Protein-Ligand Active Pocket & Molecular Dynamics Simulation -->
  <g transform="translate(425, 225)">
    <!-- Outer Energy Field Rings -->
    <circle cx="0" cy="0" r="128" fill="url(#pocketGrad)" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="6 4" opacity="0.8" />
    <circle cx="0" cy="0" r="98" fill="none" stroke="#14b8a6" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.7" />

    <!-- Protein Alpha-Helix Ribbon Curves -->
    <path d="M -85 -45 C -60 -95, -10 -85, 15 -45 C 40 -5, 85 -25, 95 20 C 105 65, 50 95, 10 70 C -30 45, -75 85, -90 30 Z"
          fill="none" stroke="url(#helixGradA)" stroke-width="8" stroke-linecap="round" opacity="0.85" filter="url(#softGlow)" />
    <path d="M -65 55 C -30 95, 35 90, 65 45 C 95 0, 65 -65, 20 -75 C -25 -85, -80 -35, -65 55 Z"
          fill="none" stroke="url(#helixGradB)" stroke-width="6" stroke-linecap="round" opacity="0.8" />

    <!-- Hydrogen Bond Dashed Tethers -->
    <g stroke="#fde047" stroke-width="1.8" stroke-dasharray="4 4">
      <line x1="-45" y1="-28" x2="-12" y2="-8" />
      <line x1="48" y1="-22" x2="16" y2="-4" />
      <line x1="35" y1="45" x2="8" y2="16" />
      <line x1="-38" y1="36" x2="-10" y2="12" />
    </g>

    <!-- Docked Small-Molecule Ligand Structure (Hexagonal Aromatic Core + Functional Groups) -->
    <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="#0f172a" stroke="#22d3ee" stroke-width="3" />
    <polygon points="0,-15 13,-7 13,7 0,15 -13,7 -13,-7" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.8" />

    <!-- Ligand Covalent Bonds -->
    <line x1="0" y1="-24" x2="0" y2="-46" stroke="#34d399" stroke-width="3" />
    <line x1="21" y1="-12" x2="42" y2="-24" stroke="#38bdf8" stroke-width="3" />
    <line x1="21" y1="12" x2="42" y2="26" stroke="#f43f5e" stroke-width="3" />
    <line x1="-21" y1="12" x2="-42" y2="26" stroke="#38bdf8" stroke-width="3" />
    <line x1="-21" y1="-12" x2="-42" y2="-24" stroke="#a855f7" stroke-width="3" />

    <!-- Ligand Atoms -->
    <circle cx="0" cy="-46" r="7" fill="#10b981" stroke="#ecfdf5" stroke-width="1.5" />
    <circle cx="42" cy="-24" r="6.5" fill="#0ea5e9" stroke="#e0f2fe" stroke-width="1.5" />
    <circle cx="42" cy="26" r="7.5" fill="#f43f5e" stroke="#ffe4e6" stroke-width="1.5" />
    <circle cx="-42" cy="26" r="6.5" fill="#06b6d4" stroke="#cffafe" stroke-width="1.5" />
    <circle cx="-42" cy="-24" r="7" fill="#a855f7" stroke="#f3e8ff" stroke-width="1.5" />
    <circle cx="0" cy="0" r="5" fill="#fde047" />

    <!-- Residue Labels Around Pocket -->
    <g font-family="monospace" font-size="10" font-weight="bold">
      <rect x="-112" y="-58" width="54" height="20" rx="5" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
      <text x="-104" y="-44" fill="#bae6fd">HIS-41</text>

      <rect x="64" y="-52" width="58" height="20" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <text x="72" y="-38" fill="#a7f3d0">CYS-145</text>

      <rect x="60" y="42" width="56" height="20" rx="5" fill="#082f49" stroke="#38bdf8" stroke-width="1" />
      <text x="67" y="56" fill="#bae6fd">GLU-166</text>

      <rect x="-114" y="38" width="56" height="20" rx="5" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="-106" y="52" fill="#c7d2fe">MET-165</text>
    </g>
  </g>

  <!-- Right Panel: HPC Pipeline Stages & Speedup Telemetry -->
  <rect x="585" y="84" width="187" height="270" rx="14" fill="url(#cardGrad)" stroke="#1e4976" stroke-width="1.2" />
  <text x="602" y="112" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">
    R&amp;D PIPELINE STATUS
  </text>

  <!-- Pipeline Step Cards -->
  <rect x="601" y="126" width="155" height="44" rx="8" fill="#061527" stroke="#0284c7" stroke-width="1" />
  <text x="613" y="144" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold">1. DockFlow-HPC</text>
  <text x="613" y="160" fill="#38bdf8" font-family="monospace" font-size="10">1.2M cmpds/day • DONE</text>

  <rect x="601" y="180" width="155" height="44" rx="8" fill="#061527" stroke="#0d9488" stroke-width="1" />
  <text x="613" y="198" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold">2. GROMACS-AutoMD</text>
  <text x="613" y="214" fill="#34d399" font-family="monospace" font-size="10">500 ns explicit • ACTIVE</text>

  <rect x="601" y="234" width="155" height="44" rx="8" fill="#061527" stroke="#6366f1" stroke-width="1" />
  <text x="613" y="252" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold">3. Omics-Nextflow</text>
  <text x="613" y="268" fill="#a5b4fc" font-family="monospace" font-size="10">scRNA + Spatial • READY</text>

  <rect x="601" y="294" width="155" height="44" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1" />
  <text x="613" y="313" fill="#5eead4" font-family="monospace" font-size="10" font-weight="bold">THROUGHPUT GAIN</text>
  <text x="613" y="329" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">8.4x Faster Runtime</text>

  <!-- Bottom Wide Panel: Molecular Dynamics Trajectory & RMSD Convergence Plot -->
  <rect x="28" y="372" width="744" height="162" rx="14" fill="url(#cardGrad)" stroke="#1e4976" stroke-width="1.2" />
  <text x="48" y="400" fill="#7dd3fc" font-family="monospace" font-size="11" font-weight="bold">
    REAL-TIME MOLECULAR DYNAMICS TRAJECTORY CONVERGENCE (RMSD / MM-PBSA FREE ENERGY)
  </text>
  <text x="618" y="400" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">
    STABILIZED @ 1.65 Å
  </text>

  <!-- Plot Axes & Grid -->
  <line x1="52" y1="418" x2="52" y2="512" stroke="#334155" stroke-width="1.2" />
  <line x1="52" y1="512" x2="748" y2="512" stroke="#334155" stroke-width="1.2" />
  <line x1="52" y1="450" x2="748" y2="450" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="52" y1="480" x2="748" y2="480" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Apo Protein Trajectory Curve (Slate/Sky) -->
  <path d="M 52 495 Q 110 445, 165 458 T 280 442 T 395 450 T 510 438 T 625 445 T 745 440"
        fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 3" opacity="0.7" />

  <!-- Holo Ligand-Bound Trajectory Curve (Glowing Emerald/Cyan) -->
  <path d="M 52 502 Q 105 470, 160 475 T 275 468 T 390 472 T 505 469 T 620 470 T 745 468"
        fill="none" stroke="#10b981" stroke-width="3" />

  <!-- Trajectory Data Points -->
  <g fill="#10b981">
    <circle cx="160" cy="475" r="4" />
    <circle cx="275" cy="468" r="4" />
    <circle cx="390" cy="472" r="4" />
    <circle cx="505" cy="469" r="4" />
    <circle cx="620" cy="470" r="4" />
    <circle cx="745" cy="468" r="5" stroke="#ecfdf5" stroke-width="1.5" />
  </g>

  <!-- Axis Labels -->
  <text x="58" y="527" fill="#64748b" font-family="monospace" font-size="10">0 ns</text>
  <text x="220" y="527" fill="#64748b" font-family="monospace" font-size="10">125 ns</text>
  <text x="385" y="527" fill="#64748b" font-family="monospace" font-size="10">250 ns</text>
  <text x="550" y="527" fill="#64748b" font-family="monospace" font-size="10">375 ns</text>
  <text x="705" y="527" fill="#64748b" font-family="monospace" font-size="10">500 ns</text>
</svg>
